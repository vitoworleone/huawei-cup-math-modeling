    <rect x="1170" y="151" width="80" height="92" rx="12" stroke="#8058c9" fill="#ffffff"/>
    <path d="M1190 220v-17m13 17v-30m13 30v-12m13 12v-38M1185 220h49" stroke="#8058c9"/>
    <circle cx="1190" cy="203" r="3" fill="#8058c9" stroke="none"/>
    <circle cx="1203" cy="190" r="3" fill="#8058c9" stroke="none"/>
    <circle cx="1216" cy="208" r="3" fill="#8058c9" stroke="none"/>
    <circle cx="1229" cy="182" r="3" fill="#8058c9" stroke="none"/>

    <rect x="1297" y="151" width="80" height="92" rx="12" stroke="#ec7934" fill="#ffffff"/>
    <path d="M1318 174h36v46h-36zM1326 187h18M1326 196h18M1326 205h10" stroke="#ec7934"/>
    <path d="m1340 215 20-23 6 5-20 23-9 3z" fill="#fff8ef" stroke="#ec7934"/>

    <rect x="1424" y="151" width="80" height="92" rx="12" stroke="#35995a" fill="#ffffff"/>
    <path d="M1464 171c-9 8-17 10-24 10v17c0 15 12 23 24 27 12-4 24-12 24-27v-17c-7 0-15-2-24-10z" stroke="#35995a"/>
    <path d="m1453 198 8 8 15-17" stroke="#35995a" stroke-width="4"/>
    <path d="m1004 197 25 0m-7-6 7 6-7 6m109-6 25 0m-7-6 7 6-7 6m109-6 25 0m-7-6 7 6-7 6m109-6 25 0m-7-6 7 6-7 6" stroke="#8b98a8"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#667486">
    <text x="956" y="273">PROBLEM</text>
    <text x="1083" y="273">MODEL</text>
    <text x="1210" y="273">FIGURE</text>
    <text x="1337" y="273">WRITE</text>
    <text x="1464" y="273">REVIEW</text>
